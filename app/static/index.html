<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>合同审查助手</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --border:#e2e5ea; --text:#23272f; --muted:#6b7280;
    --blue:#2b6cb0; --blue-bg:#e8f0fa; --amber:#b45309; --amber-bg:#fef3c7;
    --green:#15803d; --green-bg:#dcfce7; --red:#b91c1c; --red-bg:#fee2e2; --gray:#6b7280; --gray-bg:#f3f4f6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;height:100vh;display:flex;flex-direction:column}
  header{height:52px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
  header h1{font-size:15px;font-weight:600}
  header .tag{margin-left:auto;font-size:12px;color:var(--muted)}
  .layout{flex:1;display:flex;min-height:0}
  .col{border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
  .col-left{width:210px;flex-shrink:0}
  .col-mid{flex:1}
  .col-right{width:340px;flex-shrink:0;border-right:none}
  .panel-head{padding:10px 14px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:space-between}
  .scroll{flex:1;overflow-y:auto;padding:10px}
  .scroll::-webkit-scrollbar{width:8px;height:8px}
  .scroll::-webkit-scrollbar-track{background:transparent}
  .scroll::-webkit-scrollbar-thumb{background:#d7dbe3;border-radius:4px}
  .scroll::-webkit-scrollbar-thumb:hover{background:#c2c9d6}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:7px;padding:7px 12px;font-size:13px;cursor:pointer;transition:opacity .2s}
  .btn:hover{opacity:.85}
  .btn.ghost{background:var(--gray-bg);color:var(--text)}
  .btn.small{padding:4px 9px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .file-item{position:relative;padding:8px 10px 10px;border-radius:7px;background:#fff;border:1px solid var(--border);margin-bottom:7px;font-size:12.5px;cursor:pointer;transition:border-color .2s}
  .file-item:hover{border-color:var(--blue)}
  .file-item .meta{color:var(--muted);font-size:11px;margin-top:2px;padding-right:52px}
  /* 右下角删除按钮:两步确认,避免误删 */
  .file-del{position:absolute;right:6px;bottom:6px;line-height:1;font-size:11px;padding:3px 7px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--muted);cursor:pointer;font-family:inherit;transition:color .2s,border-color .2s,background .2s}
  .file-del:hover{color:var(--red);border-color:var(--red);background:var(--red-bg)}
  .file-del.armed{color:#fff;background:var(--red);border-color:var(--red)}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;flex-shrink:0;white-space:nowrap}
  .b-amber{background:var(--amber-bg);color:var(--amber)} .b-green{background:var(--green-bg);color:var(--green)}
  .b-gray{background:var(--gray-bg);color:var(--gray)} .b-blue{background:var(--blue-bg);color:var(--blue)} .b-red{background:var(--red-bg);color:var(--red)}
  .contract-item{padding:8px 10px;border-radius:7px;background:#fff;border:1px solid var(--border);margin-bottom:7px;font-size:12.5px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:border-color .2s}
  .contract-item.active{border-color:var(--blue);background:var(--blue-bg)}
  .contract-item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .finding{border:1px solid var(--border);border-radius:9px;background:#fff;padding:10px 12px;margin-bottom:8px}
  .finding .title{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .finding .quote{background:var(--gray-bg);border-radius:6px;padding:6px 9px;font-size:12px;color:var(--muted);margin:7px 0;border-left:3px solid var(--amber)}
  .finding .reason{font-size:12.5px;color:var(--muted);line-height:1.6}
  .finding .links{font-size:11.5px;color:var(--blue);margin-top:5px;word-break:break-all}
  .finding .review-row{display:flex;gap:6px;margin-top:9px}
  .review-row .btn.small.ghost{border:1px solid var(--border)}
  .review-row .btn.small.approve{background:var(--green)} .review-row .btn.small.reject{background:var(--red)}
  .empty{padding:16px;text-align:center;color:var(--muted);font-size:12.5px}
  .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
  .dot-blue{background:var(--blue)} .dot-gray{background:#cbd5e1}

  /* ---------- 对话区 ---------- */
  .chat{display:flex;flex-direction:column;height:100%}
  .chat .scroll{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:78%;animation:msgIn .18s ease-out both}
  .msg.user{align-self:flex-end}
  .msg.assistant{align-self:flex-start}
  .bubble{background:#fff;border:1px solid var(--border);border-radius:14px 14px 14px 5px;padding:11px 14px;line-height:1.75;word-break:break-word;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .msg.user .bubble{background:var(--blue);border-color:var(--blue);color:#fff;border-radius:14px 14px 5px 14px}
  @keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* markdown 渲染后 */
  .bubble p{margin:0 0 8px}
  .bubble>*:last-child{margin-bottom:0}
  .bubble h3,.bubble h4,.bubble h5,.bubble h6{font-weight:600;line-height:1.5;margin:12px 0 6px}
  .bubble h3{font-size:14.5px} .bubble h4{font-size:13.5px} .bubble h5,.bubble h6{font-size:13px;color:var(--muted)}
  .bubble ul,.bubble ol{margin:4px 0 8px;padding-left:20px}
  .bubble li{margin:3px 0}
  .bubble li::marker{color:var(--muted)}
  .bubble code{background:var(--gray-bg);border-radius:4px;padding:1px 5px;font:12.5px/1.5 Consolas,Menlo,monospace}
  .bubble pre{background:var(--gray-bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin:6px 0;overflow-x:auto}
  .bubble pre code{background:none;padding:0;font-size:12px}
  .bubble blockquote{border-left:3px solid var(--border);margin:6px 0;padding:2px 0 2px 10px;color:var(--muted)}
  .bubble hr{border:none;border-top:1px solid var(--border);margin:10px 0}
  .bubble table{border-collapse:collapse;width:100%;margin:6px 0;font-size:12.5px}
  .bubble th,.bubble td{border:1px solid var(--border);padding:5px 8px;text-align:left}
  .bubble th{background:var(--gray-bg);font-weight:600}
  .bubble a{color:var(--blue)}
  .msg.user .bubble code{background:rgba(255,255,255,.2);color:#fff}
  .msg.user .bubble a{color:#fff}

  /* 流式光标 + 等待动画 */
  .caret{display:inline-block;width:7px;height:13px;vertical-align:-2px;margin-left:2px;background:var(--blue);border-radius:1.5px;animation:caret 1s steps(1,end) infinite}
  @keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
  .typing{display:flex;gap:4px;padding:4px 0}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:typing .9s ease-in-out infinite}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes typing{0%,100%{opacity:.25;transform:translateY(0)}40%{opacity:.9;transform:translateY(-2px)}}

  /* 审查过程:整轮收敛成一行业务语言摘要,点开看细节 */
  .steps{max-width:78%;border:1px solid var(--border);background:#fff;border-radius:10px;overflow:hidden;font-size:12px;animation:msgIn .18s ease-out both;flex-shrink:0}
  .steps>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;transition:background .2s}
  .steps>summary:hover{background:var(--gray-bg)}
  .steps>summary::-webkit-details-marker{display:none}
  .steps .s-sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
  .steps .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
  .steps.running .dot{background:var(--amber);animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  .steps .chev{width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex-shrink:0;margin-right:3px}
  .steps[open] .chev{transform:rotate(-135deg)}
  .steps-body{border-top:1px dashed var(--border);padding:7px 12px 9px}
  .srow{padding:5px 0}
  .srow+.srow{border-top:1px solid var(--border)}
  .srow-head{display:flex;align-items:baseline;gap:8px}
  .slabel{color:var(--blue);font-weight:600;flex-shrink:0}
  .sdetail{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
  .sstate{flex-shrink:0;color:var(--muted);font-size:11px}
  .srow.running .sstate{color:var(--amber)}
  .sres{display:none;margin-top:4px;max-height:120px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:11.5px/1.6 Consolas,Menlo,monospace;color:var(--muted)}
  .steps[open] .sres{display:block}

  .note{align-self:center;max-width:92%;text-align:center;font-size:12px;color:var(--muted);line-height:1.7;animation:msgIn .18s ease-out both}
  .note.err{color:var(--red)}
  .empty-chat{margin:auto;text-align:center;color:var(--muted);font-size:12.5px;line-height:2.2}
  .empty-chat .big{font-size:26px;display:block;margin-bottom:6px}

  .inputbar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);background:var(--card);flex-shrink:0}
  .inputbar textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13.5px;font-family:inherit;line-height:1.5;min-height:38px;max-height:120px;transition:border-color .2s,box-shadow .2s}
  .inputbar textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
  .inputbar .btn{border-radius:10px;padding:0 16px}
</style>
</head>
<body>
<header>
  <h1>📋 合同审查助手</h1>
  <span class="tag">DeepSeek 工具调用 · Milvus 混合检索 · 规则引擎判定</span>
</header>

<div class="layout">
  <!-- 左栏:文件 -->
  <div class="col col-left">
    <div class="panel-head">📄 文件</div>
    <div class="scroll">
      <button class="btn" style="width:100%;margin-bottom:6px" onclick="document.getElementById('fileInput').click()">上传合同</button>
      <button class="btn ghost" style="width:100%;margin-bottom:10px" onclick="prepareDemo()">载入演示合同</button>
      <input type="file" id="fileInput" accept=".pdf,.docx,.png,.jpg" style="display:none" onchange="uploadFile(this.files[0])">
      <div id="fileList"></div>
    </div>
  </div>

  <!-- 中栏:对话 -->
  <div class="col col-mid">
    <div class="chat">
      <div class="scroll" id="chatScroll">
        <div class="empty-chat" id="chatEmpty"><span class="big">📋</span>先在「合同列表」里选一份合同<br>然后问一句「这份合同有什么风险?」</div>
      </div>
      <div class="inputbar">
        <textarea id="msgInput" placeholder="问:这份合同有什么风险?" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
        <button class="btn ghost" id="clearBtn" style="flex-shrink:0;padding:0 12px;font-size:12.5px;background:transparent;border:1px solid var(--border);color:var(--muted)" onclick="clearChat()">清空对话</button>
        <button class="btn" id="sendBtn" onclick="sendMessage()">发送</button>
      </div>
    </div>
  </div>

  <!-- 右栏:合同 + 意见 -->
  <div class="col col-right">
    <div class="panel-head">📦 合同列表</div>
    <div class="scroll" style="max-height:38%"><div id="contractList"></div></div>
    <div class="panel-head">⚠️ 审查意见</div>
    <div class="scroll"><div id="findingList"></div></div>
  </div>
</div>

<script>
let currentContractId = null;
const $ = id => document.getElementById(id);

function api(path, opts={}) {
  return fetch(path, opts).then(r => {
    if (!r.ok) throw new Error(path + ' -> ' + r.status);
    return r.json();
  });
}

function badge(status) {
  const map = {'需人审':'b-amber','已审':'b-green','可自动通过':'b-gray','待审':'b-gray','已解析':'b-green','待解析':'b-gray','解析失败':'b-red','已采纳':'b-green','已驳回':'b-red','待复核':'b-amber','已联系':'b-blue','已回复':'b-green','新线索':'b-gray'};
  return `<span class="badge ${map[status]||'b-gray'}">${status}</span>`;
}

function loadFiles() {
  api('/file/list').then(d => {
    $('fileList').innerHTML = d.files.length
      ? d.files.map(f => `<div class="file-item" onclick="loadContracts()">
           <div>📎 ${f.filename}</div>
           <div class="meta">${f.size} B · ${f.upload_time} · ${badge(f.parse_status)}</div>
           <button class="file-del" title="删除该文件,以及它生成的合同与审查意见"
                   onclick="event.stopPropagation();delFile(${f.id}, this)">删除</button>
         </div>`).join('')
      : `<div class="empty">暂无文件<br>上传或载入演示合同</div>`;
  }).catch(() => {});
}

/* 删除文件 → 后端级联删掉它的合同与审查意见;若删的是当前选中的合同,顺带清空对话与选区 */
function delFile(fileId, btn) {
  if ($('sendBtn').disabled) return;                 // 正在跑,先别删
  if (btn.dataset.armed !== '1') {                   // 第一步:进入待确认
    btn.dataset.armed = '1';
    btn.classList.add('armed');
    btn.textContent = '确认?';
    setTimeout(() => {
      if (btn.dataset.armed === '1') {
        btn.dataset.armed = '0'; btn.classList.remove('armed'); btn.textContent = '删除';
      }
    }, 3000);
    return;
  }
  btn.dataset.armed = '0';
  api(`/file/${fileId}`, {method: 'DELETE'})
    .then(r => {
      if (!r.ok) { addNote(`❌ 删除失败:${r.message || '未知原因'}`, true); return; }
      if ((r.contract_ids || []).includes(currentContractId)) {
        // 删掉的正是当前选中合同:选区、对话、多轮上下文一起清,避免还在追问已删的合同
        currentContractId = null;
        history.replaceState(null, '', location.pathname + location.search);
        localStorage.removeItem(CHAT_KEY);
        localStorage.removeItem(CHAT_LOG_KEY);
        CHAT_OLD_KEYS.forEach(k => localStorage.removeItem(k));
        chatLog = [];
        panelReset();
        $('chatScroll').innerHTML = EMPTY_HINT;
      }
      loadFiles();
      loadContracts();          // 未选中时会自动选第一份
      loadFindings();
      addNote(`🗑 已删除 ${r.contracts} 份合同、${r.findings} 条审查意见`);
    })
    .catch(e => addNote(`❌ 删除失败:${e.message}`, true));
}

function loadContracts() {
  api('/contract/list').then(d => {
    $('contractList').innerHTML = d.contracts.map(c =>
      `<div class="contract-item ${c.id===currentContractId?'active':''}" onclick="selectContract(${c.id})">
         <span class="name">📄 ${c.filename}</span>${badge(c.status)}
       </div>`).join('') || `<div class="empty">暂无合同</div>`;
    // 未选中任何合同时:有哈希则恢复,否则自动选第一份(避免刷新后像数据丢了)
    if (!currentContractId && d.contracts.length > 0) {
      const hashId = parseInt(location.hash.slice(1), 10);
      currentContractId = (hashId && d.contracts.some(c => c.id === hashId)) ? hashId : d.contracts[0].id;
      history.replaceState(null, '', '#' + currentContractId);
      loadFindings();
    }
  }).catch(() => {});
}

function selectContract(id) {
  currentContractId = id;
  history.replaceState(null, '', '#' + id);   // 记入 URL,刷新后恢复选中
  loadContracts();
  loadFindings();
  // 重复选中同一份合同不刷屏:同一句提示只保留一条(点来点去也不会堆)
  const dup = Array.from($('chatScroll').querySelectorAll('.note'))
    .some(n => n.textContent === `已选中合同 #${id}`);
  if (!dup) addNote(`已选中合同 #${id}`);
}

function loadFindings() {
  if (!currentContractId) { $('findingList').innerHTML = `<div class="empty">先选一份合同</div>`; return; }
  api(`/finding/list?contract_id=${currentContractId}`).then(d => {
    $('findingList').innerHTML = d.findings.length ? d.findings.map(f => `
      <div class="finding">
        <div class="title">${f.risk_point}${badge(
          f.review_status === '已采纳' || f.review_status === '已驳回'
            ? f.review_status
            : (f.need_review ? '需人审' : '可自动通过'))}</div>
        <div class="quote">${f.quote || ''}</div>
        <div class="reason">${f.reason || ''}</div>
        ${f.law_cite ? `<div class="links">📖 ${f.law_cite}</div>` : ''}
        ${f.matched_clause ? `<div class="links">📌 ${f.matched_clause}</div>` : ''}
        <div class="review-row">
          <button class="btn small approve" onclick="review(${f.id},'已采纳')">采纳</button>
          <button class="btn small reject" onclick="review(${f.id},'已驳回')">驳回</button>
          <button class="btn small ghost" onclick="review(${f.id},'待复核')">重置为待复核</button>
        </div>
      </div>`).join('') : `<div class="empty">暂无审查意见<br>在对话里问合同风险</div>`;
  }).catch(() => {});
}

function review(id, status) {
  api('/finding/review', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({finding_id:id, review_status:status})})
    .then(() => { loadFindings(); loadContracts(); });   // 合同状态会被重算,必须一起刷新
}

function uploadFile(file) {
  if (!file) return;
  const fd = new FormData(); fd.append('file', file);
  addNote(`正在解析 ${file.name}(MinerU,需几十秒)...`);
  fetch('/file/upload', {method:'POST', body:fd})
    .then(r => r.json())
    .then(d => { addNote(`✅ 解析完成:合同 #${d.contract_id},${d.status}`); loadFiles(); loadContracts(); selectContract(d.contract_id); })
    .catch(e => addNote(`❌ 解析失败:${e.message}`, true));
}

function prepareDemo() {
  addNote('正在生成并解析演示合同(4 类问题:账期 90 天 / 违约金 30% / 管辖深圳 / 缺保密条款)...');
  api('/demo/prepare', {method:'POST'})
    .then(d => { addNote(`✅ 演示合同就绪:合同 #${d.contract_id}`); loadFiles(); loadContracts(); selectContract(d.contract_id); })
    .catch(e => addNote(`❌ 失败:${e.message}`, true));
}

/* ============ 轻量 markdown 渲染(零依赖) ============ */
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function mdInline(t) {
  return t
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function md(src) {
  if (!src) return '';
  let s = escapeHtml(src).replace(/\r\n?/g, '\n');
  const blocks = [];
  s = s.replace(/```[^\n]*\n?([\s\S]*?)```/g, (m, code) => {
    blocks.push('<pre><code>' + code.replace(/\n+$/, '') + '</code></pre>');
    return '\u0000' + (blocks.length - 1) + '\u0000';
  });
  const lines = s.split('\n');
  const out = [];
  let list = null;
  const closeList = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if (m = line.match(/^\u0000(\d+)\u0000\s*$/)) { closeList(); out.push(blocks[+m[1]]); continue; }
    if (/^\s*$/.test(line)) { closeList(); continue; }
    // 表格:表头行 + |---| 分隔行
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]*---[\s:|-]*\|\s*$/.test(lines[i+1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => mdInline(c.trim()));
      const head = cells(line); i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
      i--;
      closeList();
      out.push('<table><thead><tr>' + head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table>');
      continue;
    }
    if (m = line.match(/^\s{0,3}(#{1,6})\s+(.*)$/)) { closeList(); const lv = Math.min(m[1].length + 2, 6); out.push('<h' + lv + '>' + mdInline(m[2]) + '</h' + lv + '>'); continue; }
    if (/^\s{0,3}([-*_])\1{2,}\s*$/.test(line)) { closeList(); out.push('<hr>'); continue; }
    if (m = line.match(/^\s{0,3}(?:&gt;|>)\s?(.*)$/)) { closeList(); out.push('<blockquote>' + mdInline(m[1]) + '</blockquote>'); continue; }
    if (m = line.match(/^\s*[-*+]\s+(.*)$/)) { if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + mdInline(m[1]) + '</li>'); continue; }
    if (m = line.match(/^\s*\d+[.)]\s+(.*)$/)) { if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + mdInline(m[1]) + '</li>'); continue; }
    closeList();
    out.push('<p>' + mdInline(line) + '</p>');
  }
  closeList();
  return out.join('');
}

/* ============ 对话区渲染 ============ */
// 键名里的版本号一升,浏览器里的旧对话就不再被恢复(等于清空);CHAT_OLD_KEYS 是历史残留,顺手抹掉
const CHAT_KEY = 'contract_chat_v3';
const CHAT_OLD_KEYS = ['contract_chat_history', 'contract_chat_v2'];
const EMPTY_HINT = '<div class="empty-chat" id="chatEmpty"><span class="big">📋</span>先在「合同列表」里选一份合同<br>然后问一句「这份合同有什么风险?」</div>';

function chatScrollDown() {
  const el = $('chatScroll');
  el.scrollTop = el.scrollHeight;
}

function saveChat() { localStorage.setItem(CHAT_KEY, $('chatScroll').innerHTML); }

function restoreChat() {
  CHAT_OLD_KEYS.forEach(k => localStorage.removeItem(k));
  const h = localStorage.getItem(CHAT_KEY);
  if (h && h.trim()) { $('chatScroll').innerHTML = h; dropEmptyHint(); }
  restoreChatLog();
}

/* 纯文本对话历史:随每次请求发给后端,做多轮上下文(界面存的是 HTML,这里存原文) */
const CHAT_LOG_KEY = 'contract_chat_log_v3';
let chatLog = [];

function saveChatLog() {
  try { localStorage.setItem(CHAT_LOG_KEY, JSON.stringify(chatLog.slice(-20))); } catch {}
}

function restoreChatLog() {
  try { chatLog = JSON.parse(localStorage.getItem(CHAT_LOG_KEY) || '[]') || []; } catch { chatLog = []; }
}

/* 清空对话:首次点击进入待确认,3 秒内再点一次才真清(避免误触) */
function clearChat() {
  const btn = $('clearBtn');
  if (!btn || $('sendBtn').disabled) return;          // 正在跑就不清
  if (btn.dataset.armed !== '1') {
    btn.dataset.armed = '1';
    btn.textContent = '再点一次确认';
    setTimeout(() => {
      if (btn.dataset.armed === '1') { btn.dataset.armed = '0'; btn.textContent = '清空对话'; }
    }, 3000);
    return;
  }
  btn.dataset.armed = '0';
  btn.textContent = '清空对话';
  localStorage.removeItem(CHAT_KEY);
  localStorage.removeItem(CHAT_LOG_KEY);
  CHAT_OLD_KEYS.forEach(k => localStorage.removeItem(k));
  chatLog = [];                                       // 连多轮上下文一起清,否则刷新后模型还记得旧对话
  panelReset();
  $('chatScroll').innerHTML = EMPTY_HINT;
}

function dropEmptyHint() { const e = $('chatEmpty'); if (e) e.remove(); }

function makeBubble(role) {
  const box = document.createElement('div');
  box.className = `msg ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  box.appendChild(bubble);
  $('chatScroll').appendChild(box);
  chatScrollDown();
  return { box, bubble };
}

function addMsg(role, text) {
  const { box, bubble } = makeBubble(role);
  bubble.innerHTML = md(String(text));
  if (role === 'assistant' && !String(text).trim()) bubble.remove();
  dropEmptyHint();
  saveChat();
  return box;
}

function addNote(text, isErr) {
  const el = document.createElement('div');
  el.className = 'note' + (isErr ? ' err' : '');
  el.textContent = text;
  $('chatScroll').appendChild(el);
  dropEmptyHint();
  chatScrollDown();
  saveChat();
  return el;
}

/* 流式气泡:每次增量都重新渲染 markdown,末尾跟一个光标 */
function streamer(role) {
  const { box, bubble } = makeBubble(role);
  dropEmptyHint();
  const DOTS = '<div class="typing"><i></i><i></i><i></i></div>';
  const st = { box, bubble, raw: '', live: true, pending: false };
  bubble.innerHTML = DOTS;
  st.paint = () => {
    st.pending = false;
    if (!st.raw) { bubble.innerHTML = st.live ? DOTS : ''; return; }
    bubble.innerHTML = md(st.raw);
    if (st.live) {
      const last = bubble.lastElementChild;
      if (last) last.insertAdjacentHTML('beforeend', '<span class="caret"></span>');
    }
  };
  st.push = t => {
    st.raw += t;
    if (!st.pending) { st.pending = true; requestAnimationFrame(st.paint); }
  };
  st.seal = () => {
    st.live = false; st.pending = false; st.paint();
    if (!st.raw.trim()) box.remove();     // 空气泡(只发了工具调用)直接撤掉
    else saveChat();
  };
  return st;
}

/* 审查过程:整轮只一个面板,摘要说业务语言,细节折叠 */
const TOOL_LABEL = {
  query_contract: '读取合同全文',
  search_clause: '比对标准条款库',
  search_law: '检索法条库',
  save_finding: '写入审查意见'
};
let panelEl = null, panelCounts = {}, panelSaved = 0;

function panelReset() { panelEl = null; panelCounts = {}; panelSaved = 0; }

function panelSummary() {
  const parts = [];
  if (panelCounts.query_contract) parts.push('读取合同全文');
  if (panelCounts.search_clause) parts.push(`比对标准条款库 ${panelCounts.search_clause} 次`);
  if (panelCounts.search_law) parts.push(`检索法条库 ${panelCounts.search_law} 次`);
  if (panelCounts.save_finding) parts.push(`写入审查意见 ${panelSaved || panelCounts.save_finding} 条`);
  return parts.join(' · ') || '审查过程';
}

function stepsPanel() {
  if (!panelEl) {
    panelEl = document.createElement('details');
    panelEl.className = 'steps running';
    panelEl.innerHTML = '<summary><span class="dot"></span><span class="s-sum">正在审查…</span>' +
      '<span class="chev"></span></summary><div class="steps-body"></div>';
    $('chatScroll').appendChild(panelEl);
    chatScrollDown();
  }
  return panelEl;
}

function addStep(name, args) {
  const a = args || {};
  panelCounts[name] = (panelCounts[name] || 0) + 1;
  if (name === 'save_finding' && Array.isArray(a.findings)) panelSaved = a.findings.length;
  const el = stepsPanel();
  const sum = el.querySelector('.s-sum');
  if (sum) sum.textContent = panelSummary();
  let detail = '';
  if (name === 'search_clause') detail = a.risk_desc || '';
  else if (name === 'search_law') detail = a.issue || '';
  else if (name === 'save_finding' && Array.isArray(a.findings)) {
    detail = a.findings.map(f => (f && f.risk_point) || '').filter(Boolean).join(' / ');
  }
  const row = document.createElement('div');
  row.className = 'srow running';
  row.innerHTML = `<div class="srow-head"><span class="slabel">${escapeHtml(TOOL_LABEL[name] || name)}</span>` +
    (detail ? `<span class="sdetail">${escapeHtml(detail)}</span>` : '') +
    '<span class="sstate">进行中</span></div><div class="sres"></div>';
  el.querySelector('.steps-body').appendChild(row);
  chatScrollDown();
  return row;
}

function stepDone(row, content) {
  if (!row) return;
  row.classList.remove('running');
  const s = row.querySelector('.sstate');
  if (s) s.textContent = '完成';
  const r = row.querySelector('.sres');
  if (r) r.textContent = content || '(无返回内容)';
}

function panelFinish() {
  if (!panelEl) return;
  panelEl.classList.remove('running');
  const sum = panelEl.querySelector('.s-sum');
  if (sum) sum.textContent = '✓ ' + panelSummary();
}

function logAssistant(st) {
  const t = ((st && st.raw) || '').trim();
  if (!t) return;
  const last = chatLog[chatLog.length - 1];
  if (last && last.role === 'assistant' && last.content === t) return;  // 两个 done 分支都会调,防重复
  chatLog.push({role: 'assistant', content: t});
  saveChatLog();
}

function sendMessage() {
  const input = $('msgInput');
  const text = input.value.trim();
  if (!text) return;
  if (!currentContractId) { addNote('先在右栏选一份合同'); return; }
  input.value = '';
  addMsg('user', text);
  let st = streamer('assistant');
  let lastRow = null;
  panelReset();
  chatLog.push({role: 'user', content: text});        // 记入多轮上下文
  saveChatLog();
  $('sendBtn').disabled = true;

  fetch('/chat', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({contract_id: currentContractId, message: text,
                          history: chatLog.slice(0, -1)})})   // 历史不含本轮这句(后端会单独拼)
    .then(res => {
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      function pump() {
        return reader.read().then(({done, value}) => {
          if (done) { st.seal(); logAssistant(st); $('sendBtn').disabled = false; loadFindings(); saveChat(); return; }
          buf += dec.decode(value, {stream:true});
          const parts = buf.split('\n\n');
          buf = parts.pop();
          for (const part of parts) {
            const line = part.split('\n').find(l => l.startsWith('data: '));
            if (!line) continue;
            let ev; try { ev = JSON.parse(line.slice(6)); } catch { continue; }
            if (ev.type === 'text') {
              st.push(ev.content);
            } else if (ev.type === 'text_reset') {
              // 后端判定这段是模型旁白(实测英文),撤回已流式显示的内容
              st.raw = ''; st.paint();
            } else if (ev.type === 'tool_call') {
              st.seal();                       // 工具调用前的正文收尾
              lastRow = addStep(ev.name, ev.arguments);
              st = streamer('assistant');      // 新建气泡必须排在过程面板之后,否则顺序颠倒
            } else if (ev.type === 'tool_result') {
              stepDone(lastRow, ev.content);
            } else if (ev.type === 'done') {
              st.seal(); panelFinish(); logAssistant(st); $('sendBtn').disabled = false; loadFindings(); saveChat();
            } else if (ev.type === 'error') {
              st.push(`\n\n❌ ${ev.content}`);
              st.live = false; st.paint();
              $('sendBtn').disabled = false; saveChat();
            }
          }
          chatScrollDown();
          return pump();
        });
      }
      return pump();
    })
    .catch(e => {
      st.push(`\n\n❌ ${e.message}`);
      st.live = false; st.paint();
      $('sendBtn').disabled = false;
    });
}

window.addEventListener('hashchange', () => {
  const h = parseInt(location.hash.slice(1), 10);
  if (h && h !== currentContractId) selectContract(h);
});

// 首次载入:恢复对话记录 + 若 URL 已带合同编号,恢复选中
restoreChat();
const initHash = parseInt(location.hash.slice(1), 10);
if (initHash) currentContractId = initHash;
loadFiles(); loadContracts();
</script>
